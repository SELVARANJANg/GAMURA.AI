<!DOCTYPE html>
<html lang="en" data-t="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gamura AI</title>
<script src="https://js.puter.com/v2/"></script>
<style>
:root{--ac:#19d07f;--fg:#032214;--bg:#000;--bg2:#1c1c1e;--bg3:#2c2c2e;--tx:#fff;--mu:#8e8e93;--ln:rgba(255,255,255,.12);--gl:rgba(28,28,30,.72);--fs:16px;--rd:#ff453a}
[data-t=light]{--bg:#f2f2f7;--bg2:#fff;--bg3:#e9e9ee;--tx:#000;--mu:#6c6c70;--ln:rgba(0,0,0,.1);--gl:rgba(250,250,252,.78);--rd:#d70015}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);font:var(--fs)/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",Roboto,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
button,select{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.mu{color:var(--mu)}
#au{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
#au i{position:absolute;width:60vmax;height:60vmax;border-radius:50%;filter:blur(90px);opacity:.28}
#au i:first-child{background:var(--ac);top:-30vmax;left:-20vmax}
#au i:last-child{background:#0a84ff;bottom:-35vmax;right:-25vmax;opacity:.2}
[data-t=light] #au i{opacity:.22}
@media (prefers-reduced-motion:no-preference){#au i:first-child{animation:dr 24s ease-in-out infinite alternate}@keyframes dr{to{transform:translate(18vmax,12vmax)}}}
#app{position:relative;z-index:1;height:100%;max-width:820px;margin:0 auto;display:flex;flex-direction:column}
.glass{background:var(--gl);-webkit-backdrop-filter:blur(26px) saturate(180%);backdrop-filter:blur(26px) saturate(180%)}
#top{padding:calc(8px + env(safe-area-inset-top,0)) 12px 8px;border-bottom:1px solid var(--ln)}
.bar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center}
.bar>div{display:flex;gap:8px}.bar>div:last-child{justify-content:flex-end}
.ib{width:36px;height:36px;border-radius:50%;background:var(--bg3);display:grid;place-items:center;flex:none;transition:transform .15s}
.ib:active{transform:scale(.9)}
.ib.pl{background:var(--ac);color:var(--fg)}
.ttl{display:flex;align-items:center;gap:8px;font-weight:700;font-size:17px;letter-spacing:-.2px}
.orb{width:20px;height:20px;border-radius:50%;background:conic-gradient(from 90deg,var(--ac),#0a84ff,#bf5af2,var(--ac));box-shadow:0 0 14px var(--ac)}
.orb.busy{animation:sp 1.1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.seg{display:flex;background:var(--bg3);border-radius:10px;padding:2px;gap:2px}
.seg button{flex:1;padding:6px 12px;border-radius:8px;font-size:13px;font-weight:600;color:var(--mu);transition:.2s}
.seg button.on{background:var(--bg2);color:var(--tx);box-shadow:0 1px 4px rgba(0,0,0,.25)}
[data-t=dark] .seg button.on{background:#636366}
#modeSeg{margin:10px auto 0;max-width:340px}
#cap{text-align:center;font-size:12.5px;color:var(--mu);margin-top:6px}
#chat{flex:1;overflow-y:auto;padding:16px 12px;display:flex;flex-direction:column;gap:12px;scroll-behavior:smooth}
.msg{max-width:86%;padding:10px 14px;border-radius:20px;white-space:pre-wrap;overflow-wrap:anywhere;animation:in .25s ease}
@keyframes in{from{opacity:0;transform:translateY(6px)}}
.msg.u{align-self:flex-end;background:var(--ac);color:var(--fg);border-bottom-right-radius:6px}
.msg.a{align-self:flex-start;background:var(--bg2);border:1px solid var(--ln);border-bottom-left-radius:6px}
.msg.a.w{max-width:100%;width:100%}
.msg.err{border-color:var(--rd)}
.who{font-size:12px;font-weight:700;color:var(--ac);margin-bottom:2px}
.msg b.h{display:block;font-size:1.08em;margin-top:4px}
.msg code{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:.86em;background:var(--bg3);padding:1px 6px;border-radius:6px}
.msg pre{position:relative;background:#0b0b0d;color:#e6e6ea;border-radius:12px;padding:12px;margin:8px 0;overflow-x:auto;white-space:pre}
.msg pre code{background:none;padding:0;color:inherit}
.cp{position:absolute;top:6px;right:6px;font-size:11px;font-weight:600;padding:3px 9px;border-radius:99px;background:rgba(255,255,255,.14);color:#fff}
.dots b{display:inline-block;width:7px;height:7px;margin-right:4px;border-radius:50%;background:var(--mu);animation:db 1.2s infinite}
.dots b:nth-child(2){animation-delay:.15s}.dots b:nth-child(3){animation-delay:.3s}
@keyframes db{50%{transform:translateY(-4px);opacity:.4}}
.step{display:block;font-size:12.5px;color:var(--mu);margin-top:4px;font-style:normal}
.act{display:flex;gap:2px;margin-top:6px;margin-left:-6px}
.act button{width:30px;height:30px;border-radius:50%;color:var(--mu);display:grid;place-items:center}
.act button:hover{background:var(--bg3);color:var(--tx)}
.cmp{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin-top:6px;padding-bottom:4px}
.cd{flex:0 0 min(84%,320px);scroll-snap-align:start;background:var(--bg3);border-radius:16px;padding:10px 12px;max-height:340px;overflow-y:auto}
.er{color:var(--rd)}
details{margin-top:8px}summary{cursor:pointer;color:var(--mu);font-size:13px;font-weight:600}
.empty{margin:auto;width:100%;max-width:460px;text-align:left;padding:0 6px}
.empty h1{font-size:34px;letter-spacing:-1px;line-height:1.1;background:linear-gradient(120deg,var(--tx),var(--ac));-webkit-background-clip:text;background-clip:text;color:transparent}
.empty p{color:var(--mu);margin:8px 0 18px}
.sg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sg button{text-align:left;padding:14px;border-radius:18px;background:var(--bg2);border:1px solid var(--ln);font-size:13.5px;line-height:1.35;transition:transform .15s}
.sg button:active{transform:scale(.97)}
.sg button b{display:block;font-size:18px;margin-bottom:4px}
#dock{padding-bottom:calc(8px + env(safe-area-inset-bottom,0))}
#chips{display:flex;gap:8px;overflow-x:auto;padding:4px 12px 8px;scrollbar-width:none}
.ch{flex:none;padding:7px 13px;border-radius:99px;background:var(--bg3);font-size:13px;font-weight:600;appearance:none;-webkit-appearance:none}
.ch.in{box-shadow:inset 0 0 0 1.5px var(--ac)}
.ch.on{background:var(--ac);color:var(--fg)}
#f{display:flex;align-items:flex-end;gap:6px;margin:0 10px;padding:6px;border-radius:26px;border:1px solid var(--ln)}
#inp{flex:1;resize:none;border:0;outline:0;background:none;padding:8px 6px;max-height:140px;min-height:36px}
#inp::placeholder{color:var(--mu)}
#f .ib{background:none;color:var(--mu)}
#mic.rec{color:#fff;background:var(--rd);animation:pu 1s infinite}@keyframes pu{50%{opacity:.6}}
#go{background:var(--ac)!important;color:var(--fg)!important}
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:.3s;z-index:20}
#scrim.on{opacity:1;pointer-events:auto}
#hist{position:fixed;top:0;bottom:0;left:0;width:min(88vw,340px);z-index:25;transform:translateX(-105%);transition:transform .4s cubic-bezier(.32,.72,0,1);display:flex;flex-direction:column;padding:calc(14px + env(safe-area-inset-top,0)) 12px 14px;border-right:1px solid var(--ln);background:var(--bg)}
#hist.on{transform:none}
#hist h2,.sh h2{font-size:26px;letter-spacing:-.6px}
#hs{margin:10px 0;padding:9px 12px;border-radius:10px;border:0;background:var(--bg3);outline:0}
#hl{flex:1;overflow-y:auto}
.tr{display:flex;align-items:center;border-radius:12px;padding:2px}
.tr.on{background:var(--bg3)}
.tr .tt{flex:1;text-align:left;padding:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14.5px}
.tr button:not(.tt){width:28px;height:28px;color:var(--mu);display:grid;place-items:center}
.wide{width:100%;padding:13px;border-radius:14px;background:var(--ac);color:var(--fg);font-weight:700}
#sheet{position:fixed;left:0;right:0;bottom:0;top:max(env(safe-area-inset-top,0px),28px);max-width:680px;margin:0 auto;z-index:30;background:var(--bg);border:1px solid var(--ln);border-radius:24px 24px 0 0;transform:translateY(105%);transition:transform .45s cubic-bezier(.32,.72,0,1);display:flex;flex-direction:column}
#sheet.on{transform:none}
.sh{display:flex;align-items:center;gap:12px;padding:14px 16px 10px}
.sh .seg{flex:1}
.done{color:var(--ac);font-weight:700;padding:6px}
#sb{flex:1;overflow-y:auto;padding-bottom:calc(30px + env(safe-area-inset-bottom,0))}
.cap2{margin:18px 20px 6px;font-size:13px;color:var(--mu);font-weight:600}
.grp{background:var(--bg2);border-radius:14px;margin:0 14px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:11px 14px;min-height:54px;width:100%;text-align:left}
.row+.row{border-top:1px solid var(--ln)}
.row small{display:block;color:var(--mu);font-size:12.5px;line-height:1.3}
.gr{flex:1;min-width:0}
.av{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-weight:800;color:#04150e;flex:none}
.pill{padding:7px 14px;border-radius:99px;background:var(--ac);color:var(--fg);font-weight:700;font-size:13px}
.pill.g{background:var(--bg3);color:var(--tx)}
.row input[type=text]{flex:1;min-width:0;padding:9px 12px;border-radius:10px;border:0;background:var(--bg3);outline:0}
.foot{margin:8px 22px;font-size:12.5px;color:var(--mu)}
.sw{position:relative;width:51px;height:31px;flex:none}
.sw input{position:absolute;inset:0;opacity:0;margin:0;z-index:1;cursor:pointer}
.sw span{position:absolute;inset:0;border-radius:99px;background:var(--bg3);transition:.25s}
.sw span::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.3);transition:.25s}
.sw input:checked+span{background:var(--ac)}.sw input:checked+span::after{transform:translateX(20px)}
.swt{display:flex;gap:12px}
.swt button{width:32px;height:32px;border-radius:50%}
.swt button.on{box-shadow:0 0 0 2px var(--bg2),0 0 0 4px currentColor}
.danger{color:var(--rd);font-weight:600}
#toast{position:fixed;left:50%;bottom:calc(110px + env(safe-area-inset-bottom,0));transform:translate(-50%,20px);background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:99px;font-size:13.5px;font-weight:600;opacity:0;pointer-events:none;transition:.3s;z-index:40;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div id="au"><i></i><i></i></div>
<div id="app">
  <div id="top" class="glass">
    <div class="bar">
      <div><button class="ib" id="bH" data-ic="menu" aria-label="Chat history"></button></div>
      <div class="ttl"><span class="orb" id="orb"></span>Gamura AI</div>
      <div><button class="ib" id="bN" data-ic="edit" aria-label="New chat"></button><button class="ib pl" id="bA" data-ic="plus" aria-label="Add AI connectors"></button></div>
    </div>
    <div class="seg" id="modeSeg" data-k="mode"><button data-v="chat">Chat</button><button data-v="compare">Compare</button><button data-v="council">Council</button></div>
    <p id="cap"></p>
  </div>
  <div id="chat" aria-live="polite"></div>
  <div id="dock">
    <div id="chips"></div>
    <form id="f" class="glass">
      <button type="button" class="ib" id="mic" data-ic="mic" aria-label="Voice input"></button>
      <textarea id="inp" rows="1" placeholder="Message Gamura AI"></textarea>
      <button type="button" class="ib" id="wand" data-ic="spark" aria-label="Improve my prompt"></button>
      <button type="submit" class="ib" id="go" aria-label="Send"></button>
    </form>
  </div>
</div>
<div id="scrim"></div>
<aside id="hist"><h2>Chats</h2><input id="hs" type="search" placeholder="Search"><div id="hl"></div><button class="wide" id="hn">New chat</button></aside>
<section id="sheet" aria-label="Connectors and settings">
  <div class="sh"><div class="seg" data-k="tab"><button data-v="c">Connectors</button><button data-v="s">Settings</button></div><button class="done" id="dn">Done</button></div>
  <div id="sb"></div>
</section>
<div id="toast"></div>

<script>
/* Add or edit connectors here. model = Puter model id. */
var CONNECTORS=[
 {id:"gemini",name:"Gemini",by:"Google",model:"gemini-2.0-flash",color:"#6ea8ff",desc:"Fast all-round assistant."},
 {id:"chatgpt",name:"ChatGPT",by:"OpenAI",model:"gpt-4o-mini",color:"#19d07f",desc:"Writing, coding and ideas."},
 {id:"claude",name:"Claude",by:"Anthropic",model:"claude-sonnet-4",color:"#ffb26b",desc:"Careful, detailed answers."},
 {id:"deepseek",name:"DeepSeek",by:"DeepSeek",model:"deepseek-chat",color:"#7aa2ff",desc:"Reasoning and code."},
 {id:"llama",name:"Llama",by:"Meta",model:"openrouter:meta-llama/llama-3.3-70b-instruct",color:"#c79bff",desc:"Quick open model for daily chat."},
 {id:"mistral",name:"Mistral",by:"Mistral AI",model:"mistral-large-latest",color:"#ffd36b",desc:"Compact and multilingual."}
];
var PERSONAS={general:["Assistant","You are Gamura AI, a helpful and accurate assistant. Be clear and concise."],code:["Coder","You are an expert software engineer. Give working code with short explanations."],tutor:["Tutor","You are a patient tutor. Explain step by step with simple examples."],write:["Writer","You are a skilled writer and editor. Produce polished, natural prose."],trans:["Translator","You are a translator. Translate faithfully into the language the user asks for, or English if unspecified."],fun:["Playful","You are witty and playful but still helpful. Keep answers short."]};
var ACC={emerald:["#19d07f","#032214"],blue:["#0a84ff","#fff"],violet:["#a35cf5","#fff"],orange:["#ff9f0a","#1a0f00"],pink:["#ff375f","#fff"]};
var ICON={menu:"M4 7h16M4 12h16M4 17h10",plus:"M12 5v14M5 12h14",edit:"M4 20h4L19 9l-4-4L4 16v4zM13 7l4 4",mic:"M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3zM6 11a6 6 0 0 0 12 0M12 17v4",spark:"M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8zM18 16l.8 2.2L21 19l-2.2.8L18 22l-.8-2.2L15 19l2.2-.8z",up:"M12 19V5M5 12l7-7 7 7",stop:"M7 7h10v10H7z",copy:"M9 9h10v11H9zM5 15V4h10",spk:"M4 9v6h4l5 4V5L8 9zM16 9a4 4 0 0 1 0 6",redo:"M20 12a8 8 0 1 1-3-6.2M20 4v5h-5",trash:"M5 7h14M10 7V4h4v3M7 7l1 13h8l1-13",pin:"M12 17v5M8 3h8l-1 6 3 4H6l3-4z",pen:"M4 20h4L19 9l-4-4L4 16v4z"};
function ic(n,s){s=s||20;return'<svg width="'+s+'" height="'+s+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="'+ICON[n]+'"/></svg>'}
function $(i){return document.getElementById(i)}
function esc(t){return String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
var K="gamura_ai_v2",S=load(),busy=false,stopF=false,live=null,raf=0,tab="c",inp=$("inp");
function load(){try{var s=JSON.parse(localStorage.getItem(K));if(s&&s.threads)return s}catch(e){}
 return{connected:["gemini"],current:"gemini",custom:[],threads:[],active:null,persona:"general",mode:"chat",theme:"auto",accent:"emerald",size:"m"}}
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
function all(){return CONNECTORS.concat(S.custom)}
function cn(id){return all().filter(function(c){return c.id===id})[0]}
function th(){return S.threads.filter(function(t){return t.id===S.active})[0]}
function newThread(){var t={id:"t"+Date.now(),title:"New chat",msgs:[],pin:false,t:Date.now()};S.threads.push(t);S.active=t.id;return t}
function toast(m){var t=$("toast");t.textContent=m;t.classList.add("on");clearTimeout(toast.h);toast.h=setTimeout(function(){t.classList.remove("on")},2600)}
function theme(){
 var d=S.theme==="auto"?(matchMedia("(prefers-color-scheme: light)").matches?"light":"dark"):S.theme,r=document.documentElement,a=ACC[S.accent]||ACC.emerald;
 r.dataset.t=d;r.style.setProperty("--ac",a[0]);r.style.setProperty("--fg",a[1]);r.style.setProperty("--fs",{s:"14.5px",m:"16px",l:"18px"}[S.size]||"16px")
}
function md(t){return esc(t).split(/(```[\s\S]*?```)/).map(function(p){
 var m=p.match(/^```\w*\n?([\s\S]*?)```$/);
 if(m)return"<pre><code>"+m[1].replace(/\n$/,"")+"</code></pre>";
 return p.replace(/^\n/,"").replace(/^#{1,3} (.+)$/gm,'<b class="h">$1</b>').replace(/^[-*] /gm,"\u2022 ").replace(/`([^`\n]+)`/g,"<code>$1</code>").replace(/\*\*([^*\n]+)\*\*/g,"<b>$1</b>")}).join("")}
function body(c,step){return c?md(c):'<span class="dots"><b></b><b></b><b></b></span>'+(step?'<em class="step">'+esc(step)+"</em>":"")}
function card(c){return'<div class="cd"><div class="who">'+esc(c.who)+"</div>"+(c.err?'<span class="er">'+esc(c.content)+"</span>":body(c.content))+"</div>"}
function ht(m){return m.content||((m.cmp||[]).filter(function(c){return c.content&&!c.err})[0]||{}).content||""}
function paint(el,m,i,last){
 var u=m.role==="user";
 el.className="msg "+(u?"u":"a")+(m.err?" err":"")+(m.kind==="compare"||m.kind==="council"?" w":"");
 if(u){el.textContent=m.content;return}
 var h;
 if(m.kind==="compare")h='<div class="who">Side by side</div><div class="cmp">'+m.cmp.map(card).join("")+"</div>";
 else if(m.kind==="council")h='<div class="who">Council verdict by '+esc(m.judge||"AI")+"</div>"+body(m.content,m.step)+"<details><summary>See each AI\u2019s answer</summary><div class=\"cmp\">"+m.cmp.map(card).join("")+"</div></details>";
 else h='<div class="who">'+esc(m.who||"AI")+"</div>"+body(m.content,m.step);
 if(m.done)h+='<div class="act"><button data-a="copy" data-i="'+i+'" aria-label="Copy">'+ic("copy",16)+'</button><button data-a="spk" data-i="'+i+'" aria-label="Read aloud">'+ic("spk",16)+"</button>"+(last?'<button data-a="redo" data-i="'+i+'" aria-label="Try again">'+ic("redo",16)+"</button>":"")+"</div>";
 el.innerHTML=h;
 el.querySelectorAll("pre").forEach(function(p){var b=document.createElement("button");b.className="cp";b.textContent="Copy";p.appendChild(b)})
}
function greet(){var h=new Date().getHours();return h<12?"Good morning":h<18?"Good afternoon":"Good evening"}
var SUG=[["Explain","Explain how the internet works in simple words"],["Code","Write a Python script that renames all files in a folder"],["Plan","Plan a 3-day trip to Chennai on a student budget"],["Ideas","Give me 10 app ideas a college student can build"]];
function render(){
 theme();
 var n=S.connected.length,c=cn(S.current),m=S.mode;
 $("cap").textContent=m==="chat"?(c&&n?"Chatting with "+c.name:"No AI connected. Tap + to add one."):m==="compare"?"Asking "+Math.min(n,4)+" AIs side by side":Math.min(n,3)+" AIs answer, "+(c?c.name:"one")+" merges the best";
 document.querySelectorAll("#modeSeg button").forEach(function(b){b.classList.toggle("on",b.dataset.v===m)});
 var h=S.connected.map(cn).filter(Boolean).map(function(x){return'<button class="ch'+(x.id===S.current?" on":(m!=="chat"?" in":""))+'" data-chip="'+x.id+'">'+esc(x.name)+"</button>"}).join("");
 h+='<select class="ch" id="persona" aria-label="Style">'+Object.keys(PERSONAS).map(function(k){return'<option value="'+k+'"'+(k===S.persona?" selected":"")+">"+PERSONAS[k][0]+"</option>"}).join("")+"</select>";
 $("chips").innerHTML=h;
 $("persona").onchange=function(){S.persona=this.value;save()};
 var ch=$("chat"),t=th();
 if(!t||!t.msgs.length){
  ch.innerHTML='<div class="empty"><h1>'+greet()+".<br>What can I help with?</h1><p>Gemini, Claude, ChatGPT and more, together in one place.</p><div class=\"sg\">"+SUG.map(function(s,i){return'<button data-sg="'+i+'"><b>'+s[0]+"</b>"+s[1]+"</button>"}).join("")+"</div></div>";return}
 ch.innerHTML="";
 t.msgs.forEach(function(x,i){var d=document.createElement("div");paint(d,x,i,i===t.msgs.length-1);ch.appendChild(d)});
 ch.scrollTop=ch.scrollHeight
}
function sched(){if(raf)return;raf=requestAnimationFrame(function(){raf=0;if(!live)return;var ch=$("chat"),st=ch.scrollHeight-ch.scrollTop-ch.clientHeight<140;paint(live.el,live.m,live.i,false);if(st)ch.scrollTop=ch.scrollHeight})}
function setBusy(){$("go").innerHTML=ic(busy?"stop":"up");$("orb").classList.toggle("busy",busy);$("go").setAttribute("aria-label",busy?"Stop":"Send")}
function reason(e){var s=e&&(e.message||(e.error&&(e.error.message||e.error))||e.msg)||"";if(typeof s!=="string")try{s=JSON.stringify(s)}catch(x){s=""}return s||"Request failed"}
async function ask(c,msgs,cb){var r=await puter.ai.chat(msgs,{model:c.model,stream:true}),out="";
 for await(var p of r){if(stopF)break;if(p&&p.text){out+=p.text;cb(out)}}return out}
function hist(t,upto){return t.msgs.slice(0,upto).filter(function(x){return!x.err}).map(function(x){return{role:x.role,content:x.role==="user"?x.content:ht(x)}}).filter(function(x){return x.content}).slice(-16)}
async function send(raw){
 var text=(raw||inp.value).trim();if(!text||busy)return;
 var mode=S.mode,cons=S.connected.map(cn).filter(Boolean),tgt=cn(S.current),mt=text.match(/^@(\w+)\s+([\s\S]+)/);
 if(mt){var f=all().filter(function(c){return c.id===mt[1].toLowerCase()||c.name.toLowerCase()===mt[1].toLowerCase()})[0];
  if(f){if(S.connected.indexOf(f.id)<0){toast(f.name+" is not connected yet");openSheet("c");return}tgt=f;text=mt[2];mode="chat"}}
 if(!cons.length||!tgt||S.connected.indexOf(tgt.id)<0){toast("Connect an AI first");openSheet("c");return}
 if(mode!=="chat"&&cons.length<2){toast("Connect at least 2 AIs for "+mode);openSheet("c");return}
 if(!window.puter){toast("AI service did not load. Check your connection.");return}
 try{if(!puter.auth.isSignedIn())await puter.auth.signIn()}catch(e){}
 inp.value="";grow();
 var t=th()||newThread();if(!t.msgs.length)t.title=text.slice(0,38);t.t=Date.now();
 t.msgs.push({role:"user",content:text});
 var m={role:"assistant",kind:mode,who:tgt.name,content:"",step:""};t.msgs.push(m);
 var base=[{role:"system",content:PERSONAS[S.persona][1]}].concat(hist(t,t.msgs.length-1));
 busy=true;stopF=false;setBusy();render();
 live={el:$("chat").lastElementChild,m:m,i:t.msgs.length-1};
 try{
  if(mode==="chat"){
   try{await ask(tgt,base,function(x){m.content=x;sched()});if(!m.content&&!stopF)throw new Error("No reply")}
   catch(e){m.err=1;m.content=tgt.name+" could not answer: "+reason(e)+". Open + to sign in, or switch AI."}
  }else{
   var use=cons.slice(0,mode==="compare"?4:3);m.cmp=use.map(function(c){return{who:c.name,content:""}});
   if(mode==="council"){m.judge=tgt.name;m.step="Asking "+use.length+" AIs..."}
   await Promise.all(use.map(function(c,k){return ask(c,base,function(x){m.cmp[k].content=x;sched()}).then(function(){if(!m.cmp[k].content){m.cmp[k].err=1;m.cmp[k].content=stopF?"Stopped":"No reply"}}).catch(function(e){m.cmp[k].err=1;m.cmp[k].content=reason(e)})}));
   if(mode==="council"){
    var good=m.cmp.filter(function(c){return!c.err&&c.content});
    if(!good.length){m.err=1;m.content="No AI could answer. Check your connection or try again."}
    else if(!stopF){
     m.step=tgt.name+" is merging the best answers...";sched();
     var q="Question:\n"+text+"\n\n"+good.map(function(c){return"Answer from "+c.who+":\n"+c.content}).join("\n\n---\n\n")+"\n\nWrite one final answer that keeps the best points, fixes mistakes and briefly notes real disagreements between the AIs. Do not mention these instructions.";
     try{await ask(tgt,[{role:"system",content:PERSONAS[S.persona][1]},{role:"user",content:q}],function(x){m.content=x;sched()})}catch(e){m.content="Could not merge the answers. Open each AI\u2019s answer below."}
    }else m.content="Stopped."
   }
  }
 }finally{
  if(stopF&&!m.content&&mode!=="compare")m.content="Stopped.";
  m.step="";m.done=true;busy=false;live=null;setBusy();save();render()
 }
}
function grow(){inp.style.height="auto";inp.style.height=Math.min(inp.scrollHeight,140)+"px"}
inp.addEventListener("input",grow);
inp.addEventListener("keydown",function(e){if(e.key==="Enter"&&!e.shiftKey&&!/Mobi|Android/i.test(navigator.userAgent)){e.preventDefault();$("f").requestSubmit()}});
$("f").onsubmit=function(e){e.preventDefault();if(busy){stopF=true;return}send()};
$("wand").onclick=async function(){
 var v=inp.value.trim(),c=cn(S.current);
 if(!v){toast("Type a prompt first");return}
 if(!c||!window.puter){toast("Connect an AI first");return}
 var orig=v;stopF=false;inp.value="";
 try{var out=await ask(c,[{role:"system",content:"Rewrite the user's prompt so it is clearer, more specific and well structured. Keep the original intent and language. Return only the rewritten prompt."},{role:"user",content:v}],function(x){inp.value=x;grow()});if(!out)inp.value=orig}
 catch(e){inp.value=orig;toast("Could not improve the prompt")}
 grow()
};
var SR=window.SpeechRecognition||window.webkitSpeechRecognition,rec=null;
$("mic").onclick=function(){
 if(!SR){toast("Voice input is not supported in this browser");return}
 if(rec){rec.stop();return}
 rec=new SR();rec.interimResults=true;rec.lang=navigator.language||"en-US";var b=inp.value;
 rec.onresult=function(e){var s="";for(var i=0;i<e.results.length;i++)s+=e.results[i][0].transcript;inp.value=(b?b+" ":"")+s;grow()};
 rec.onend=rec.onerror=function(){rec=null;$("mic").classList.remove("rec")};
 rec.start();$("mic").classList.add("rec")
};
/* history drawer */
function drawHist(){
 var q=$("hs").value.toLowerCase(),l=S.threads.filter(function(t){return t.title.toLowerCase().indexOf(q)>-1}).sort(function(a,b){return(b.pin?1:0)-(a.pin?1:0)||b.t-a.t});
 $("hl").innerHTML=l.length?l.map(function(t){return'<div class="tr'+(t.id===S.active?" on":"")+'"><button class="tt" data-o="'+t.id+'">'+(t.pin?"\u2605 ":"")+esc(t.title)+'</button><button data-p="'+t.id+'" aria-label="Pin">'+ic("pin",15)+'</button><button data-r="'+t.id+'" aria-label="Rename">'+ic("pen",15)+'</button><button data-d="'+t.id+'" aria-label="Delete">'+ic("trash",15)+"</button></div>"}).join(""):'<p class="mu" style="padding:12px">No chats yet.</p>'
}
$("hs").oninput=drawHist;
function openHist(){drawHist();$("hist").classList.add("on");$("scrim").classList.add("on")}
function closeAll(){["hist","sheet","scrim"].forEach(function(i){$(i).classList.remove("on")})}
function newChat(){S.active=null;save();render();closeAll()}
$("bH").onclick=openHist;$("bN").onclick=newChat;$("hn").onclick=newChat;$("scrim").onclick=closeAll;$("dn").onclick=function(){closeAll();render()};
$("bA").onclick=function(){openSheet("c")};
document.addEventListener("keydown",function(e){if(e.key==="Escape")closeAll()});
/* sheet */
function openSheet(t){tab=t||"c";drawSheet();$("sheet").classList.add("on");$("scrim").classList.add("on")}
function sg(k,v,l){return'<div class="seg" data-k="'+k+'">'+l.map(function(x){return'<button data-v="'+x[0]+'"'+(x[0]===v?' class="on"':"")+">"+x[1]+"</button>"}).join("")+"</div>"}
function drawSheet(){
 document.querySelectorAll('.sh .seg button').forEach(function(b){b.classList.toggle("on",b.dataset.v===tab)});
 var h="";
 if(tab==="c"){
  h+='<p class="cap2">Account</p><div class="grp"><div class="row"><div class="av" style="background:var(--ac);color:var(--fg)">P</div><div class="gr"><b>Puter</b><small id="acs">Checking...</small></div><button class="pill" id="acb">Sign in</button></div></div>';
  h+='<p class="cap2">AI connectors</p><div class="grp">'+all().map(function(c){var on=S.connected.indexOf(c.id)>-1;return'<div class="row"><div class="av" style="background:'+c.color+'">'+esc(c.name[0])+'</div><div class="gr"><b>'+esc(c.name)+"</b><small>"+esc(c.by||"Custom")+" \u2013 "+esc(c.desc||c.model)+"</small></div>"+(c.custom?'<button class="pill g" data-rm="'+c.id+'">Remove</button>':"")+'<label class="sw"><input type="checkbox" data-cn="'+c.id+'"'+(on?" checked":"")+' aria-label="'+esc(c.name)+'"><span></span></label></div>'}).join("")+"</div>";
  h+='<p class="cap2">Add your own</p><div class="grp"><div class="row"><input type="text" id="n1" placeholder="Name, e.g. Qwen"><input type="text" id="n2" placeholder="Puter model id"></div><div class="row"><button class="pill" id="nadd">Add connector</button></div></div><p class="foot">Tip: type @claude or @gemini at the start of a message to ask one AI directly.</p>';
  $("sb").innerHTML=h;acct()
 }else{
  h+='<p class="cap2">Appearance</p><div class="grp"><div class="row">'+sg("theme",S.theme,[["auto","Auto"],["light","Light"],["dark","Dark"]])+'</div><div class="row"><span class="gr">Accent</span><div class="swt">'+Object.keys(ACC).map(function(k){return'<button data-ac="'+k+'" class="'+(k===S.accent?"on":"")+'" style="background:'+ACC[k][0]+';color:'+ACC[k][0]+'" aria-label="'+k+'"></button>'}).join("")+'</div></div><div class="row"><span class="gr">Text size</span>'+sg("size",S.size,[["s","Small"],["m","Medium"],["l","Large"]])+"</div></div>";
  h+='<p class="cap2">Chats</p><div class="grp"><button class="row" id="exp">Export this chat</button><button class="row danger" id="wipe">Delete all chats</button></div><p class="foot">Gamura AI keeps chats on this device only. AI replies come through your Puter account.</p>';
  $("sb").innerHTML=h
 }
}
async function acct(){
 var s=$("acs"),b=$("acb");if(!s)return;
 if(!window.puter){s.textContent="AI service did not load";b.style.display="none";return}
 if(puter.auth.isSignedIn()){var n="Signed in";try{n="Signed in as "+(await puter.auth.getUser()).username}catch(e){}s.textContent=n;b.style.display="none"}
 else{s.textContent="One free sign-in unlocks every connector";b.onclick=async function(){try{await puter.auth.signIn()}catch(e){}acct()}}
}
function seg(k,v){
 if(k==="tab"){tab=v;drawSheet();return}
 if(k==="mode")S.mode=v;if(k==="theme")S.theme=v;if(k==="size")S.size=v;
 save();render();if(k!=="mode")drawSheet()
}
document.addEventListener("click",function(e){
 var t=e.target,b;
 if(b=t.closest(".seg button")){seg(b.parentNode.dataset.k,b.dataset.v);return}
 if(b=t.closest("[data-chip]")){S.current=b.dataset.chip;save();render();return}
 if(b=t.closest("[data-sg]")){if(!busy)send(SUG[b.dataset.sg][1]);return}
 if(b=t.closest("[data-ac]")){S.accent=b.dataset.ac;save();theme();drawSheet();return}
 if(b=t.closest("[data-rm]")){var id=b.dataset.rm;S.custom=S.custom.filter(function(c){return c.id!==id});S.connected=S.connected.filter(function(c){return c!==id});if(S.current===id)S.current=S.connected[0]||"";save();drawSheet();render();return}
 if(b=t.closest(".cp")){var c=b.parentNode.querySelector("code");navigator.clipboard&&navigator.clipboard.writeText(c.textContent);b.textContent="Copied";setTimeout(function(){b.textContent="Copy"},1400);return}
 if(b=t.closest("[data-a]")){act(b.dataset.a,+b.dataset.i);return}
 if(b=t.closest("[data-o]")){S.active=b.dataset.o;save();render();closeAll();return}
 if(b=t.closest("[data-p]")){var p=S.threads.filter(function(x){return x.id===b.dataset.p})[0];p.pin=!p.pin;save();drawHist();return}
 if(b=t.closest("[data-r]")){var r=S.threads.filter(function(x){return x.id===b.dataset.r})[0],nm=prompt("Rename chat",r.title);if(nm&&nm.trim()){r.title=nm.trim().slice(0,60);save();drawHist()}return}
 if(b=t.closest("[data-d]")){var d=b.dataset.d;if(confirm("Delete this chat?")){S.threads=S.threads.filter(function(x){return x.id!==d});if(S.active===d)S.active=null;save();drawHist();render()}return}
 if(t.closest("#nadd")){var a=$("n1").value.trim(),m=$("n2").value.trim();if(!a||!m){toast("Enter a name and a model id");return}
  var id="c"+Date.now();S.custom.push({id:id,name:a,by:"Custom",model:m,color:"#8e8e93",desc:m,custom:true});save();drawSheet();return}
 if(t.closest("#exp")){var x=th();if(!x||!x.msgs.length){toast("Nothing to export yet");return}
  var md2="# "+x.title+"\n\n"+x.msgs.map(function(m){return"**"+(m.role==="user"?"You":(m.who||"AI"))+":**\n"+(m.role==="user"?m.content:ht(m))}).join("\n\n");
  var a2=document.createElement("a");a2.href=URL.createObjectURL(new Blob([md2],{type:"text/markdown"}));a2.download=x.title.replace(/[^\w]+/g,"-")+".md";a2.click();return}
 if(t.closest("#wipe")){if(confirm("Delete all chats on this device?")){S.threads=[];S.active=null;save();render();toast("All chats deleted")}}
});
document.addEventListener("change",async function(e){
 var c=e.target.getAttribute&&e.target.getAttribute("data-cn");if(!c)return;
 var i=S.connected.indexOf(c);
 if(i>-1&&!e.target.checked){S.connected.splice(i,1);if(S.current===c)S.current=S.connected[0]||""}
 else if(e.target.checked){try{if(window.puter&&!puter.auth.isSignedIn())await puter.auth.signIn()}catch(x){}if(S.connected.indexOf(c)<0)S.connected.push(c);S.current=c}
 save();drawSheet();render()
});
function act(a,i){
 var t=th(),m=t&&t.msgs[i];if(!m)return;
 var txt=m.kind==="compare"?m.cmp.map(function(c){return c.who+":\n"+c.content}).join("\n\n"):m.content;
 if(a==="copy"){navigator.clipboard&&navigator.clipboard.writeText(txt);toast("Copied")}
 if(a==="spk"){if(!window.speechSynthesis){toast("Read aloud is not supported here");return}speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(txt.replace(/[`*#]/g,"")))}
 if(a==="redo"&&!busy){var u=t.msgs[i-1];if(!u)return;t.msgs.splice(i-1,2);save();send(u.content)}
}
matchMedia("(prefers-color-scheme: light)").addEventListener&&matchMedia("(prefers-color-scheme: light)").addEventListener("change",function(){if(S.theme==="auto")theme()});
document.querySelectorAll("[data-ic]").forEach(function(b){b.innerHTML=ic(b.dataset.ic)});
setBusy();render();
</script>
</body>
</html>
